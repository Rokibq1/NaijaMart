
services:
  db:
    image: postgres:18-alpine
    container_name: naijamart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: naijamart
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - naijamart_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d naijamart"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: naijamart-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/naijamart
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  naijamart_data:
