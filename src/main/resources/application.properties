
spring.application.name=NaijaMart

# =====================================
# PostgreSQL Database Configuration
# =====================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naijamart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:NaijaMart@2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA and Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# Server Configuration
# =====================================
server.port=${PORT:8080}
# =====================================
# Gmail SMTP Email Configuration
# =====================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.from=${MAIL_USERNAME:}

# =====================================
# NaijaMart Email Branding
# =====================================
naijamart.email.sender-name=NaijaMart Company

# =====================================
# Google OAuth2 Configuration
# =====================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}

# =====================================
# Manual Bank Transfer Configuration
# =====================================

naijamart.bank.account-name=${BANK_ACCOUNT_NAME:}
naijamart.bank.bank-name=${BANK_NAME:}
naijamart.bank.account-number=${BANK_ACCOUNT_NUMBER:}

# Transfer proof upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
