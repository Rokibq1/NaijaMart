spring.application.name=NaijaMart

# =====================================
# PostgreSQL Database Configuration
# =====================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naijamart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:NaijaMart@2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA and Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# Server Configuration
# =====================================
server.port=${PORT:8080}

# =====================================
# Gmail SMTP Configuration
# =====================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Email Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =====================================
# Paystack Test Configuration
# =====================================
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
paystack.currency=NGN
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:8080/?payment=callback}

